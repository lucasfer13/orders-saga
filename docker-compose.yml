# Everything the system needs: Postgres, RabbitMQ with its management UI, and
# the four .NET services. `docker compose up -d` is the only step.
#
# Local-dev-only credentials, not valid anywhere else -- not real secrets.
#
# The services run as Development so their OpenAPI document and Scalar UI are
# reachable: showing the API is part of what this repo is for. The code keeps
# the environment gate, so nothing is exposed outside this compose file.

services:
  postgres:
    image: postgres:18-alpine
    container_name: orders-saga-postgres
    environment:
      POSTGRES_USER: orders_saga
      POSTGRES_PASSWORD: orders_saga_dev_only
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 mounts the data volume at /var/lib/postgresql (not
      # .../data) -- see https://github.com/docker-library/postgres/pull/1259
      #
      # No init script: each service creates and migrates its own database
      # on startup via EF Core Database.Migrate() (see ESTANDAR-CALIDAD.md,
      # /health/startup). Postgres starts with only its maintenance database.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: orders-saga-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: orders_saga
      RABBITMQ_DEFAULT_PASS: orders_saga_dev_only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders:
    build:
      context: .
      dockerfile: src/Orders.Api/Dockerfile
    container_name: orders-saga-orders
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships with the Alpine base image, so this needs nothing extra.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  inventory:
    build:
      context: .
      dockerfile: src/Inventory.Api/Dockerfile
    container_name: orders-saga-inventory
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Environment variables outrank appsettings.Development.json, so this wins
      # over the localhost default the repo versions for `dotnet run`.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=inventory;Username=orders_saga;Password=orders_saga_dev_only;Timeout=3"
      # Off by default in the service; on here because without stock there is no demo.
      Inventory__SeedStock: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships with the Alpine base image, so this needs nothing extra.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  payments:
    build:
      context: .
      dockerfile: src/Payments.Api/Dockerfile
    container_name: orders-saga-payments
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Environment variables outrank appsettings.Development.json, so this wins
      # over the localhost default the repo versions for `dotnet run`.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=payments;Username=orders_saga;Password=orders_saga_dev_only;Timeout=3"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships with the Alpine base image, so this needs nothing extra.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  shipping:
    build:
      context: .
      dockerfile: src/Shipping.Api/Dockerfile
    container_name: orders-saga-shipping
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Environment variables outrank appsettings.Development.json, so this wins
      # over the localhost default the repo versions for `dotnet run`.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=shipping;Username=orders_saga;Password=orders_saga_dev_only;Timeout=3"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships with the Alpine base image, so this needs nothing extra.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
