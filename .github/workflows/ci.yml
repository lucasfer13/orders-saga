name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # docker-compose.dcproj sits next to OrdersSaga.slnx, so a bare dotnet
      # command is ambiguous (MSB1011). Always target the .slnx; the SDK
      # skips the dcproj (not a NuGet-package project) on restore/build.
      - name: Restore
        run: dotnet restore OrdersSaga.slnx

      - name: Build
        run: dotnet build OrdersSaga.slnx --no-restore --configuration Release

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release
            !**/bin/Release/**/*.pdb
          retention-days: 1

  format:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet format --verify-no-changes
        run: dotnet format OrdersSaga.slnx --verify-no-changes --verbosity diagnostic

  # xUnit v3 runs on Microsoft.Testing.Platform (see global.json), not
  # VSTest: each job targets a .csproj with --project, not a folder, and
  # TRX needs --report-trx (Microsoft.Testing.Extensions.TrxReport in each
  # test project) instead of --logger "trx;...".
  test-unit:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      - name: Unit tests
        run: >
          dotnet test --project tests/unit/OrdersSaga.UnitTests/OrdersSaga.UnitTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: test-results/*.trx

  test-integration:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # Testcontainers needs Docker: available by default on ubuntu-latest.
      - name: Integration tests (Testcontainers)
        run: >
          dotnet test --project tests/integration/OrdersSaga.IntegrationTests/OrdersSaga.IntegrationTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: test-results/*.trx

  test-architecture:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # Separate job on purpose (see PLAN.md): an architecture-boundary
      # failure should be visible at a glance, not mixed with functional tests.
      - name: Architecture tests
        run: >
          dotnet test --project tests/architecture/OrdersSaga.ArchitectureTests/OrdersSaga.ArchitectureTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-architecture
          path: test-results/*.trx

  vulnerability-scan:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # dotnet list package --vulnerable can't target the whole solution
      # (docker-compose.dcproj isn't a NuGet-package project), so each
      # .csproj is scanned separately. The command also always exits 0
      # regardless of findings (known SDK limitation), so pass/fail comes
      # from checking the JSON output for a "vulnerabilities" key — same
      # approach as the pre-commit hook (.claude/settings.json).
      - name: dotnet list package --vulnerable (per project)
        run: |
          mkdir -p vulnerability-scan
          fail=0
          while IFS= read -r proj; do
            name="$(basename "$proj" .csproj)"
            echo "Scanning $proj"
            dotnet list "$proj" package --vulnerable --include-transitive --format json > "vulnerability-scan/$name.json"
            if grep -q '"vulnerabilities"' "vulnerability-scan/$name.json"; then
              echo "::error::Vulnerable package found in $proj"
              fail=1
            fi
          done < <(find src tests -name '*.csproj')
          exit $fail
      - name: Publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-log
          path: vulnerability-scan/*.json

  # Deliberate placeholder: once the 4 services have a Dockerfile, add a
  # Trivy or `docker scout` job here for the final image (see PLAN.md,
  # "Higiene de CI que se ve desde fuera").
  # image-scan:
  #   needs: restore-and-build
  #   runs-on: ubuntu-latest
  #   steps: [...]
