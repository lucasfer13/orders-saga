name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # docker-compose.dcproj vive junto a OrdersSaga.slnx en la raíz, así que
      # los comandos dotnet sin objetivo explícito son ambiguos (MSB1011).
      # Se apunta siempre a OrdersSaga.slnx; el propio SDK ignora el dcproj
      # (no es un proyecto de paquetes NuGet) en restore/build.
      - name: Restore
        run: dotnet restore OrdersSaga.slnx

      - name: Build
        run: dotnet build OrdersSaga.slnx --no-restore --configuration Release

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release
            !**/bin/Release/**/*.pdb
          retention-days: 1

  format:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet format --verify-no-changes
        run: dotnet format OrdersSaga.slnx --verify-no-changes --verbosity diagnostic

  # xUnit v3 corre sobre Microsoft.Testing.Platform (ver global.json), no
  # VSTest: cada job apunta a un .csproj con --project, no a una carpeta, y
  # el TRX se pide con --report-trx (paquete Microsoft.Testing.Extensions.
  # TrxReport en cada proyecto de test) en vez de --logger "trx;...".
  test-unit:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      - name: Tests unitarios
        run: >
          dotnet test --project tests/unit/OrdersSaga.UnitTests/OrdersSaga.UnitTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: test-results/*.trx

  test-integration:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # Testcontainers necesita Docker: disponible por defecto en ubuntu-latest.
      - name: Tests de integración (Testcontainers)
        run: >
          dotnet test --project tests/integration/OrdersSaga.IntegrationTests/OrdersSaga.IntegrationTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: test-results/*.trx

  test-architecture:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # Job separado a propósito (ver PLAN.md): que se vea de un vistazo si
      # lo que falla es una frontera arquitectónica, no un test funcional.
      - name: Tests de arquitectura
        run: >
          dotnet test --project tests/architecture/OrdersSaga.ArchitectureTests/OrdersSaga.ArchitectureTests.csproj
          --configuration Release --no-restore
          --report-trx --results-directory ./test-results
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-architecture
          path: test-results/*.trx

  vulnerability-scan:
    needs: restore-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OrdersSaga.slnx
      # dotnet list package --vulnerable no puede apuntar a la solución
      # entera (docker-compose.dcproj no es un proyecto de paquetes NuGet),
      # así que se escanea cada .csproj por separado. El comando además
      # siempre devuelve exit code 0 aunque encuentre vulnerabilidades
      # (limitación conocida del SDK), así que el fallo se deriva de mirar
      # si el JSON de salida trae la clave "vulnerabilities" — igual que en
      # el hook de pre-commit (.claude/settings.json).
      - name: dotnet list package --vulnerable (por proyecto)
        run: |
          mkdir -p vulnerability-scan
          fail=0
          while IFS= read -r proj; do
            name="$(basename "$proj" .csproj)"
            echo "Escaneando $proj"
            dotnet list "$proj" package --vulnerable --include-transitive --format json > "vulnerability-scan/$name.json"
            if grep -q '"vulnerabilities"' "vulnerability-scan/$name.json"; then
              echo "::error::Paquete vulnerable encontrado en $proj"
              fail=1
            fi
          done < <(find src tests -name '*.csproj')
          exit $fail
      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-log
          path: vulnerability-scan/*.json

  # Placeholder deliberado: cuando los 4 servicios tengan Dockerfile, añadir
  # aquí un job de Trivy o `docker scout` sobre la imagen final (ver
  # PLAN.md, "Higiene de CI que se ve desde fuera").
  # image-scan:
  #   needs: restore-and-build
  #   runs-on: ubuntu-latest
  #   steps: [...]
